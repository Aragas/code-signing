name: Test signing

# Signs a throwaway library the way a release does: requested through BUTR/workflows' sign-certum.yml, as a file and
# inside a NuGet package. Checks both are signed with the certificate from config.json. Run it by hand after changing
# the signing, like bumping the jay0lee/certum-cloud-code-sign pin

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build a test library
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Build and pack
      shell: pwsh
      run: |
        dotnet new classlib -n Hello -o src -f netstandard2.0
        dotnet pack src/Hello.csproj -c Release -o out -p:PackageId=CodeSigning.Test -p:Version=1.0.$env:GITHUB_RUN_NUMBER -p:Authors=Aragas -p:Description=Test
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Copy-Item src/bin/Release/netstandard2.0/Hello.dll out/

    - name: Upload the library
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test
        path: ./out/
        if-no-files-found: error

  sign:
    name: Sign
    needs: build
    uses: BUTR/workflows/.github/workflows/sign-certum.yml@master
    with:
      artifact_name: test
    secrets:
      CODE_SIGNING_CLIENT_ID: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
      CODE_SIGNING_PRIVATE_KEY: ${{ secrets.CODE_SIGNING_PRIVATE_KEY }}

  check:
    name: Check the signatures
    needs: sign
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the signed library
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: test
        path: ./test

    - name: Check the signatures
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Add-Type -AssemblyName System.IO.Compression
        $expected = ((Get-Content ./config.json -Raw | ConvertFrom-Json).certificate.sha1 -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()

        $package = Get-ChildItem ./test -Filter *.nupkg | Select-Object -First 1
        $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
        try {
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($zip.GetEntry('lib/netstandard2.0/Hello.dll'), "$env:RUNNER_TEMP/Hello.from-package.dll")
        } finally {
          $zip.Dispose()
        }

        $failed = $false
        foreach ($file in @((Resolve-Path ./test/Hello.dll).Path, "$env:RUNNER_TEMP/Hello.from-package.dll")) {
          $signature = Get-AuthenticodeSignature $file
          $thumbprint = $signature.SignerCertificate.Thumbprint
          $timestamped = $null -ne $signature.TimeStamperCertificate
          Write-Host "$(Split-Path $file -Leaf): $($signature.Status), signer $($signature.SignerCertificate.Subject), thumbprint $thumbprint, timestamped $timestamped"
          if ($signature.Status -ne 'Valid' -or $thumbprint -ne $expected -or -not $timestamped) { $failed = $true }
        }
        if ($failed) {
          Write-Error "A file isn't signed with $expected, or isn't timestamped"
          exit 1
        }
        Write-Host "Both files are signed with $expected and timestamped"
